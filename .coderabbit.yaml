language: "de-AT"

tone_instructions: >
  Antworte sehr kurz und präzise. Keine langen Erklärungen.
  Konzentriere dich auf relevante Findings und die Jira-Akzeptanzkriterien.

reviews:
  # Nur wichtige Findings melden.
  profile: "quiet"

  # Review-Ausgabe möglichst klein halten.
  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  related_issues: false
  related_prs: false

  # Hilfreich beim Testen:
  # zeigt zusätzlichen verwendeten Kontext an.
  review_details: true

  # Kein klassischer Linked-Issue-Check nötig,
  # da LAKWYC-123 nur als String im PR steht.
  assess_linked_issues: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  pre_merge_checks:
    custom_checks:
      - name: "Jira Acceptance Criteria"
        mode: "warning"
        instructions: |
          Search the pull request title and description for a Jira issue key
          matching exactly this pattern:

          LAKWYC-[0-9]+

          Example:
          LAKWYC-123

          If no LAKWYC issue key exists:
          PASS immediately.
          Do not perform any Jira or functional analysis.

          If a LAKWYC issue key exists:

          Use the configured MCP server to retrieve the Jira issue.

          Jira context:
          - Jira space: "LF - AI knows what you've committed"
          - Jira project: "LAKWYC"
          - Issue key format: LAKWYC-[number]

          IMPORTANT:
          - The MCP server MUST be used to retrieve the ticket.
          - Do not infer ticket content from the PR title.
          - Do not infer ticket content from the PR description.
          - Do not infer acceptance criteria from branch names,
            commit messages or source code.
          - Do not fabricate missing Jira information.

          Retrieve at minimum:
          - issue key
          - summary
          - description
          - acceptance criteria

          Compare every acceptance criterion with the implementation
          contained in this pull request.

          Evaluate both:
          - technical correctness
          - functional/business correctness

          For each acceptance criterion classify it as:

          PASS    = clearly implemented
          PARTIAL = partially implemented
          FAIL    = not implemented or incorrectly implemented
          UNKNOWN = cannot be verified from this pull request

          PASS the check only if every acceptance criterion is PASS.

          If the Jira ticket cannot be retrieved through MCP:
          do NOT perform an extended review.
          Return a short warning indicating that MCP/Jira context
          was unavailable.

          Keep the complete result concise.
